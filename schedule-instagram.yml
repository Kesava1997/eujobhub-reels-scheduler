name: Instagram Reels Publisher

on:
  schedule:
    - cron: "0,30 * * * *"   # every 30 min, on the hour and half-hour
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Instagram publisher (single pass)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python instagram_publisher.py --run-once

      - name: Commit updated schedule/log back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add reels_schedule.json ig_publish_log.csv
          git diff --cached --quiet || git commit -m "Instagram publish update [skip ci]"
          git push
